name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install System Libraries (OCR & Magic)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmagic1 \
            libmagic-dev \
            poppler-utils \
            tesseract-ocr \
            libgl1-mesa-glx \
            libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app/ backend/tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as advisory
          flake8 backend/app/ backend/tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Execute Pytest Suite with Coverage
        env:
          MONGODB_URL: mongodb://localhost:27017
          USE_LOCAL_MONGODB: "true"
          LOCAL_MONGODB_URL: mongodb://localhost:27017
          DB_NAME: test_timetable_db_ci
          SECRET_KEY: ci-testing-super-secret-key-32-chars
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          SOLVER_TIME_LIMIT_SECONDS: 30
          PYTHONPATH: backend
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 14

  frontend-lint-and-build:
    name: Frontend Dependencies & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Build Frontend Application
        working-directory: frontend
        run: |
          npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

  docker-build-validation:
    name: Docker Containerization Sanity Check
    runs-on: ubuntu-latest
    needs: [ backend-lint-and-test, frontend-lint-and-build ]
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: timetable-scheduler-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: timetable-scheduler-frontend:ci-check
