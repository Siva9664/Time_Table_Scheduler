version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: scheduler_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scheduler_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - USE_LOCAL_MONGODB=true
      - LOCAL_MONGODB_URL=mongodb://mongodb:27017
      - DB_NAME=Time-Table-Scheduler
      - SECRET_KEY=ci-cd-production-super-secret-key-change-me
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=4320
      - ALLOWED_ORIGINS=http://localhost:3002,http://localhost:3000,http://127.0.0.1:3002
      - SOLVER_TIME_LIMIT_SECONDS=60
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scheduler_frontend
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      - backend

volumes:
  mongo_data:
